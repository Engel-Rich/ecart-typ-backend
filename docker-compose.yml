

services:
    # Service pour le serveur web
    nginx:
        image: nginx:1.22-alpine
        restart: always
        container_name: nginx-ecartify
        ports:
            - 8801:80
            - 8444:443
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - ./:/www/html/ecartify
        depends_on:
            - php
    php:
        restart: always
        build: .
        volumes:
            - ./:/www/html/ecartify
        container_name: ecartify-backend
        environment:
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3307
            - DB_DATABASE=ecartify_db
            # - DB_USERNAME=richelieu
            # - DB_PASSWORD=richelieu
        expose:
            - 9000
    adminer:
        image: adminer
        restart: always
        container_name: adminer-ecartify
        ports:
            - "8084:8080"
    mysql:
        image:                  mysql:8.0.30
        container_name:         mysql-ecartify
        restart:                always
        volumes:
            - ./data_db:/var/lib/mysql
        ports:
            - "3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD:  root
            MYSQL_DATABASE:       ecartify_db

